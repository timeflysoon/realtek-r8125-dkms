name: Import Secrets

on:
  workflow_dispatch:   # 手动触发

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Secrets from JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          
          jq -c 'to_entries[]' secrets.json | while read -r item; do
            name=$(echo "$item" | jq -r '.key')
            value=$(echo "$item" | jq -r '.value')
            echo "导入: $name"
            echo "$value" | gh secret set "$name" -R "$REPO"
          done
        shell: bash
