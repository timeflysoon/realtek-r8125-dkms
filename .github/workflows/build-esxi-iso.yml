# ══════════════════════════════════════════════
# 1. 添加 Secret：本仓库 → Settings → Secrets → Actions
#    名称固定为 AUTH_PAT_<账号名大写>，例如账号 timeflysoon → AUTH_PAT_TIMEFLYSOON，
#    账号 88alt → AUTH_PAT_88ALT。建议权限：repo（写 Secret + 管理 Release 都需要）
#
# 2. OD_CLIENT_ID / OD_CLIENT_SECRET / OD_TENANT_ID / OD_REFRESH_TOKEN 仍按各仓库
#    实际对应的 OneDrive 租户单独配置，与账号名无关，不做自动识别。
