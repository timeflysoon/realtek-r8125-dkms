name: Convert APK to IPK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 下载并检查文件
        run: |
          # 下载文件
          wget --no-check-certificate https://opkg.cooluc.com/openwrt-25.12/x86_64/vmlinux-btf-6.12.79.apk -O input.apk
          
          # 诊断文件类型
          echo "=== 文件类型检测 ==="
          file input.apk
          
          echo "=== 文件大小 ==="
          ls -lh input.apk
          
          echo "=== 文件头 ==="
          xxd -l 32 input.apk
          
          # 检查是否是 HTML 错误页面
          if grep -q "<html" input.apk 2>/dev/null; then
            echo "ERROR: 文件是 HTML 页面，URL 可能无效"
            cat input.apk
            exit 1
          fi

      - name: 解压并重新打包为 IPK
        run: |
          mkdir -p ipk_build/data ipk_build/control temp_apk
          
          # 尝试多种解压方式
          if tar -xzf input.apk -C temp_apk 2>/dev/null; then
            echo "成功以 tar.gz 格式解压"
          elif ar x input.apk && tar -xzf data.tar.gz -C temp_apk 2>/dev/null; then
            echo "成功以 deb/ar 格式解压"
          elif unzip -q input.apk -d temp_apk 2>/dev/null; then
            echo "成功以 zip 格式解压"
          else
            echo "ERROR: 无法识别的文件格式"
            file input.apk
            exit 1
          fi
          
          # 提取数据文件
          find temp_apk -maxdepth 1 ! -name ".*" ! -name "temp_apk" -exec cp -r {} ipk_build/data/ \; 2>/dev/null || true
          
          # 如果没有数据文件，尝试进入子目录
          if [ -z "$(ls -A ipk_build/data)" ]; then
            find temp_apk -type f -exec cp --parents {} ipk_build/data/ \; 2>/dev/null || true
          fi
          
          # 创建 control 文件
          printf '%s\n' \
            'Package: vmlinux-btf' \
            'Version: 6.12.79' \
            'Architecture: x86_64' \
            'Maintainer: Your Name <your@email.com>' \
            'Description: Linux kernel vmlinux with BTF info for dae' \
            ' This package provides BTF information required by dae eBPF.' \
            '' > ipk_build/control/control
          
          # 打包
          cd ipk_build/data && tar -czf ../data.tar.gz . && cd ../..
          cd ipk_build/control && tar -czf ../control.tar.gz . && cd ../..
          
          # 合并为 IPK
          echo "2.0" > ipk_build/debian-binary
          cd ipk_build && tar -czf ../vmlinux-btf-6.12.79.ipk debian-binary control.tar.gz data.tar.gz
          
          echo "✅ 成功生成 vmlinux-btf-6.12.79.ipk"
          ls -lh ../vmlinux-btf-6.12.79.ipk

      - name: 上传 IPK 作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-btf-6.12.79
          path: vmlinux-btf-6.12.79.ipk

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: vmlinux-btf-6.12.79.ipk
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
