name: Convert APK to IPK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否创建 GitHub Release'
        required: false
        default: 'false'
        type: boolean
  push:
    tags: ['v*']

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: 下载内核文件
        run: |
          wget https://opkg.cooluc.com/openwrt-25.12/x86_64/vmlinux-btf-6.12.79.apk -O vmlinux-btf-6.12.79

      - name: 直接打包为 IPK
        run: |
          mkdir -p ipk_build/data/boot ipk_build/control
          cp vmlinux-btf-6.12.79 ipk_build/data/boot/vmlinux-btf-6.12.79
          
          printf '%s\n' \
            'Package: vmlinux-btf' \
            'Version: 6.12.79' \
            'Architecture: x86_64' \
            'Maintainer: Your Name <your@email.com>' \
            'Description: Linux kernel vmlinux with BTF info for dae' \
            ' This package provides BTF information required by dae eBPF.' \
            '' > ipk_build/control/control
          
          cd ipk_build/control && tar -czf ../control.tar.gz . && cd ../..
          cd ipk_build/data && tar -czf ../data.tar.gz . && cd ../..
          
          echo "2.0" > ipk_build/debian-binary
          cd ipk_build && tar -czf ../vmlinux-btf-6.12.79.ipk debian-binary control.tar.gz data.tar.gz
          
          echo "✅ 成功生成 vmlinux-btf-6.12.79.ipk"

      - name: 上传 IPK 作为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-btf-6.12.79
          path: vmlinux-btf-6.12.79.ipk

      - name: 创建 GitHub Release 并上传 IPK
        uses: softprops/action-gh-release@v1
        # 只有在推送 tag 时，或者手动触发时明确选择了创建 Release 时才运行
        if: |
          startsWith(github.ref, 'refs/tags/') || 
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        with:
          files: vmlinux-btf-6.12.79.ipk
          generate_release_notes: true
          # 如果是手动触发且没有 tag，使用 commit SHA 作为预发布版本
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.sha) }}
          prerelease: ${{ github.event_name != 'push' }}
