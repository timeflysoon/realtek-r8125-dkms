name: Export Repository Secrets

on:
  workflow_dispatch:  # 手动触发

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export all secrets to JSON file
        run: |
          echo '${{ toJSON(secrets) }}' > secrets.json
          echo "所有 Secrets 已导出到 secrets.json"
          cat secrets.json | jq .   # 美化显示（可选）
        shell: bash

      - name: Upload secrets as artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-secrets
          path: secrets.json
