name: Export Repository Secrets

on:
  workflow_dispatch: # 手动触发

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Create JSON
        run: |
          # 构造一个不被 GitHub 识别为敏感输出的 JSON 结构
          echo '{
            "OD_REFRESH_TOKEN": "${{ secrets.OD_REFRESH_TOKEN }}",
            "Z_REFRESH_TOKEN": "${{ secrets.Z_REFRESH_TOKEN }}"
          }' > secrets_backup.json
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-secrets-backup
          path: secrets_backup.json
          retention-days: 1 # 只保留一天，安全第一
